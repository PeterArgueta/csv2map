<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ConvertToMap convierte archivos CSV en capas de departamentos y municipios de Guatemala para QGIS, ArcGIS, Google Earth y aplicaciones web." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ConvertToMap · Convierte tus datos en mapas GIS</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XLFZT2C3BX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XLFZT2C3BX');

      // Analytics de producto: navegación y acciones clave.
      (function () {
        const sendPageView = () => {
          gtag('event', 'page_view', {
            page_path: window.location.pathname,
            page_location: window.location.href,
            page_title: document.title
          });
        };

        const originalPushState = history.pushState;
        history.pushState = function () {
          originalPushState.apply(this, arguments);
          setTimeout(sendPageView, 0);
        };
        window.addEventListener('popstate', () => setTimeout(sendPageView, 0));

        document.addEventListener('click', (event) => {
          const target = event.target.closest('a,button');
          if (!target) return;
          const text = (target.textContent || '').trim();
          const href = target.getAttribute('href') || '';

          if (text === 'Probar con ejemplo') {
            const level = document.querySelector('#nivel')?.value || 'desconocido';
            gtag('event', 'load_example', { geographic_level: level });
          }

          if (href.includes('/downloads/')) {
            const file = href.split('/').pop() || '';
            const layer = file.startsWith('municipios_') ? 'municipios' : 'departamentos';
            let format = 'geojson';
            if (file.endsWith('.gpkg')) format = 'gpkg';
            else if (file.endsWith('.kml')) format = 'kml';
            else if (file.endsWith('.zip')) format = 'shp';
            gtag('event', 'download_layer', { layer, format, file_name: file });
          }

          if (href === 'https://qr.converttomap.com') {
            gtag('event', 'visit_qr', { destination: 'qr.converttomap.com' });
          }
        });

        let lastSuccess = '';
        const observer = new MutationObserver(() => {
          const messages = Array.from(document.querySelectorAll('div'))
            .map((node) => (node.textContent || '').trim())
            .filter((value) => value.startsWith('ZIP generado:'));
          const success = messages[0] || '';
          if (!success || success === lastSuccess) return;
          lastSuccess = success;
          const level = document.querySelector('#nivel')?.value || 'desconocido';
          gtag('event', 'conversion_completed', {
            geographic_level: level,
            result_message: success.slice(0, 100)
          });
        });

        window.addEventListener('DOMContentLoaded', () => {
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();

      // Nombre de descarga de los ZIP generados por el conversor.
      (function () {
        const originalAnchorClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function () {
          if (this.download && /_resultado\.zip$/i.test(this.download)) {
            const now = new Date();
            const pad = (value) => String(value).padStart(2, '0');
            const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
            this.download = `converttomap_${stamp}.zip`;
          }
          return originalAnchorClick.call(this);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
