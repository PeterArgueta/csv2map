services:
  - type: web
    name: csv2map
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    domains:
      - api.converttomap.com
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://converttomap.com,https://www.converttomap.com
