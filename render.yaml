services:
  - type: web
    name: csv2map
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    domains:
      - api.converttomap.com
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://converttomap.com,https://www.converttomap.com,https://csv2map.vercel.app

  - type: web
    name: converttomap-web
    runtime: static
    buildCommand: cd geo_guate_frontend && npm ci && npm run build
    staticPublishPath: ./geo_guate_frontend/dist
    autoDeployTrigger: checksPass
    domains:
      - converttomap.com
    envVars:
      - key: VITE_API_URL
        value: https://api.converttomap.com
