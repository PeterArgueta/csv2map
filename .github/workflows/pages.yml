name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "geo_guate_frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: geo_guate_frontend/package-lock.json

      - name: Restore official GIS source cache
        uses: actions/cache@v4
        with:
          path: geo_guate_frontend/data/remote_cache
          key: official-gis-sources-v2-${{ runner.os }}
          restore-keys: |
            official-gis-sources-v1-${{ runner.os }}
            official-gis-sources-v1-

      - name: Generate static GIS downloads
        working-directory: geo_guate_frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin zip
          python scripts/build_gis_assets.py

      - name: Validate generated GIS assets
        working-directory: geo_guate_frontend
        run: python scripts/validate_catalog.py --check-assets

      - name: Build frontend
        working-directory: geo_guate_frontend
        env:
          VITE_API_URL: https://api.converttomap.com
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: geo_guate_frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
