name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "geo_guate_frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: geo_guate_frontend/package-lock.json

      - name: Generate static GIS downloads
        working-directory: geo_guate_frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin zip
          mkdir -p public/downloads /tmp/ctm-departamentos /tmp/ctm-municipios /tmp/ctm-zonas /tmp/ctm-mex-estados public/countries/MEX

          cp public/Departamentos/departamentos.geojson public/downloads/departamentos_guatemala.geojson
          cp public/Municipios/municipios.geojson public/downloads/municipios_guatemala.geojson
          python - <<'PY'
          import glob
          import json

          features = []
          for path in sorted(glob.glob("public/ZonasGuatemala/parts/*.geojson")):
              with open(path, encoding="utf-8") as source:
                  features.extend(json.load(source)["features"])

          with open("public/ZonasGuatemala/zonas_ciudad_guatemala.geojson", "w", encoding="utf-8") as output:
              json.dump(
                  {"type": "FeatureCollection", "features": features},
                  output,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
          PY

          cp public/ZonasGuatemala/zonas_ciudad_guatemala.geojson public/downloads/zonas_ciudad_guatemala.geojson


          curl -L --fail --retry 3 \
            "https://github.com/wmgeolab/geoBoundaries/raw/90a1d52/releaseData/gbOpen/MEX/ADM1/geoBoundaries-MEX-ADM1_simplified.geojson" \
            -o /tmp/mexico_adm1_source.geojson

          python - <<'PY'
          import json
          import unicodedata

          codes = {
              "aguascalientes": "01", "baja california": "02", "baja california sur": "03",
              "campeche": "04", "coahuila": "05", "coahuila de zaragoza": "05",
              "colima": "06", "chiapas": "07", "chihuahua": "08",
              "ciudad de mexico": "09", "distrito federal": "09", "durango": "10",
              "guanajuato": "11", "guerrero": "12", "hidalgo": "13", "jalisco": "14",
              "mexico": "15", "estado de mexico": "15", "michoacan": "16",
              "michoacan de ocampo": "16", "morelos": "17", "nayarit": "18",
              "nuevo leon": "19", "oaxaca": "20", "puebla": "21", "queretaro": "22",
              "queretaro de arteaga": "22", "quintana roo": "23", "san luis potosi": "24",
              "sinaloa": "25", "sonora": "26", "tabasco": "27", "tamaulipas": "28",
              "tlaxcala": "29", "veracruz": "30", "veracruz de ignacio de la llave": "30",
              "yucatan": "31", "zacatecas": "32",
          }

          def norm(value):
              text = unicodedata.normalize("NFKD", str(value or ""))
              text = "".join(c for c in text if not unicodedata.combining(c))
              return " ".join(text.lower().replace("-", " ").split())

          with open("/tmp/mexico_adm1_source.geojson", encoding="utf-8") as source:
              data = json.load(source)

          features = []
          for feature in data.get("features", []):
              props = feature.get("properties", {})
              name = str(props.get("shapeName") or props.get("name") or "").strip()
              code = codes.get(norm(name))
              if not code:
                  raise SystemExit(f"No code mapping for Mexico state: {name!r}")
              features.append({
                  "type": "Feature",
                  "properties": {"admin_code": code, "name": name},
                  "geometry": feature.get("geometry"),
              })

          if len(features) != 32:
              raise SystemExit(f"Expected 32 Mexico states, got {len(features)}")

          out = {"type": "FeatureCollection", "features": features}
          with open("public/countries/MEX/admin1.geojson", "w", encoding="utf-8") as target:
              json.dump(out, target, ensure_ascii=False, separators=(",", ":"))
          PY

          ogr2ogr -f GeoJSON public/countries/MEX/admin1.optimized.geojson public/countries/MEX/admin1.geojson -simplify 0.01
          cp public/countries/MEX/admin1.geojson public/downloads/estados_mexico.geojson

          ogr2ogr -f GPKG public/downloads/departamentos_guatemala.gpkg public/Departamentos/departamentos.geojson -nln departamentos
          ogr2ogr -f KML public/downloads/departamentos_guatemala.kml public/Departamentos/departamentos.geojson -nln departamentos
          ogr2ogr -f "ESRI Shapefile" /tmp/ctm-departamentos public/Departamentos/departamentos.geojson -nln departamentos -lco ENCODING=UTF-8
          zip -j public/downloads/departamentos_guatemala_shapefile.zip /tmp/ctm-departamentos/*

          ogr2ogr -f GPKG public/downloads/municipios_guatemala.gpkg public/Municipios/municipios.geojson -nln municipios
          ogr2ogr -f KML public/downloads/municipios_guatemala.kml public/Municipios/municipios.geojson -nln municipios
          ogr2ogr -f "ESRI Shapefile" /tmp/ctm-municipios public/Municipios/municipios.geojson -nln municipios -lco ENCODING=UTF-8
          zip -j public/downloads/municipios_guatemala_shapefile.zip /tmp/ctm-municipios/*

          ogr2ogr -f GPKG public/downloads/zonas_ciudad_guatemala.gpkg public/ZonasGuatemala/zonas_ciudad_guatemala.geojson -nln zonas_ciudad_guatemala
          ogr2ogr -f KML public/downloads/zonas_ciudad_guatemala.kml public/ZonasGuatemala/zonas_ciudad_guatemala.geojson -nln zonas_ciudad_guatemala
          ogr2ogr -f "ESRI Shapefile" /tmp/ctm-zonas public/ZonasGuatemala/zonas_ciudad_guatemala.geojson -nln zonas_ciudad_guatemala -lco ENCODING=UTF-8
          zip -j public/downloads/zonas_ciudad_guatemala_shapefile.zip /tmp/ctm-zonas/*


          ogr2ogr -f GPKG public/downloads/estados_mexico.gpkg public/countries/MEX/admin1.geojson -nln estados
          ogr2ogr -f KML public/downloads/estados_mexico.kml public/countries/MEX/admin1.geojson -nln estados
          ogr2ogr -f "ESRI Shapefile" /tmp/ctm-mex-estados public/countries/MEX/admin1.geojson -nln estados -lco ENCODING=UTF-8
          zip -j public/downloads/estados_mexico_shapefile.zip /tmp/ctm-mex-estados/*

      - name: Build frontend
        working-directory: geo_guate_frontend
        env:
          VITE_API_URL: https://api.converttomap.com
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: geo_guate_frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
