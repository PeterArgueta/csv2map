name: Verificar CSV2MAP

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar backend
        run: pip install -r requirements-dev.txt

      - name: Probar backend
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: geo_guate_frontend/package-lock.json

      - name: Validar catálogo GIS
        working-directory: geo_guate_frontend
        run: python scripts/validate_catalog.py

      - name: Compilar frontend
        working-directory: geo_guate_frontend
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          npm run check:links
